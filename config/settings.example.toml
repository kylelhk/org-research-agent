# Copy this file to config/settings.private.toml and fill in the real values.
# The private copy is git-ignored. Never commit client criteria or prompts.

[area]
# Placeholder values only; real values live in the private file.
suburbs = ["Example Suburb"]
radius_km = 3
min_organisations = 10
# Optional: other suburbs an organisation in range may list as its address.
nearby_suburbs = ["Nearby Suburb"]
# Optional: local place names that may appear in agent output (streets, centres).
allowed_terms = ["Example Highway"]
# Optional: centre point for the OpenStreetMap search. Leave out to skip the map.
centre_lat = -1.5
centre_lon = 2.5

[fit]
# Placeholder categories; the client's real criteria go in the private file.
types = ["example type A", "example type B"]
min_staff = 2
# Optional: true lets a website's signs of several staff (practitioners in the plural,
# more than one profession, or more than one location) stand in for a stated number.
staff_signals = false

[prompts]
# Extra guidance added to the research prompt, loaded from the private file.
# Write {suburbs} where the run's chosen suburbs should go, such as "in or near {suburbs}".
research = "REPLACE_IN_PRIVATE_FILE"
